id = "universal_viewer"
name = "Universal Viewer"
version = "0.2.1"
description = "Map pictures on slot icons and in the tooltip; see inside shulker boxes and bundles by holding Shift; placed shulker boxes open in their own colour."
authors = []
license = "MIT"
# A native mod: Rust in src/, compiled by the launcher against the game build [native] pins, beside data/ and assets/.
api = "0.2"
side = "client"
# registries: "May add blocks, items, mob effects and entity types to your worlds".
capabilities = ["registries"]

[native]
game = "26.3"
horizon = "f1bb66f353cf67f2aa4665293fc75c8d91186fc7"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"

# Client side, any server: copy the map pictures a vanilla server sends
# (ClientboundMapItemDataPacket) so maps show without the mod on the server.
[[native.mixin]]
id = "vanilla_map"
target = "horizon_client::game::maps::Game<'_>::remote_map_item_data"
kind = "HEAD"
helper = "src/mixins/vanilla_map.rs"
bindings = [
  { name = "game", ty = "&Game<'_>", value = "&*self" },
  { name = "p", ty = "&horizon_protocol::packets::play::MapItemData", value = "p" },
]
